<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>תרגולי אק״ג — הכנה לסבבים קליניים</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">

<main id="app"></main>
<div id="lb" class="lb" hidden>

    <span class="lb-hint">גלגלת / צביטה להגדלה · גרירה להזזה · Esc לסגירה</span>
    <button data-z="close" class="lb-close" title="סגירה">✕</button>
  </div>
  <div class="lb-stage"><img id="lbimg" alt="ECG"></div>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
